plugins {
    id 'java'
    id 'application'
}

group = 'com.engreversa'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

application {
    mainClass = 'com.engreversa.financial.Main'
}

test {
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
}
