plugins {
    id 'java'
    id 'application'
    id 'jacoco'
    id 'org.sonarqube' version '7.5.0.8588'
}

group = 'com.engreversa'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

// Gera gradle.lockfile, permitindo ao Trivy auditar as bibliotecas (CVEs).
dependencyLocking {
    lockAllConfigurations()
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

application {
    mainClass = 'com.engreversa.financial.Main'
}

jar {
    manifest {
        attributes 'Main-Class': application.mainClass
    }
}

test {
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
    }
}

sonar {
    properties {
        property 'sonar.host.url', 'https://sonarcloud.io'
        property 'sonar.organization', 'bayer-07'
        property 'sonar.projectKey', 'Bayer-07_reengenharia-reversa'
        property 'sonar.projectName', 'reengenharia-reversa'
    }
}
